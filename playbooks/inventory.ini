# Inventario — AdminLinux Clase 14 (Ansible + Infraestructura como Código)
#
# El inventario le dice a Ansible A QUIÉN le habla. Es la agenda de contactos.
# Con una sola VM alcanza: todo el material corre contra [local] (tu propia máquina).

# Tu propia máquina, sin SSH (conexión directa). Ideal para practicar.
[local]
localhost ansible_connection=local

# --- De acá para abajo es EJEMPLO comentado: así se ve un inventario real ---
# Descomentá y editá cuando tengas una 2da VM. Se llega por SSH (Clase 11).
#
# [web]
# nodo1 ansible_host=192.168.1.11
# nodo2 ansible_host=192.168.1.12
#
# [bd]
# db01 ansible_host=192.168.1.31
#
# Un grupo puede contener otros grupos:
# [sitio:children]
# web
# bd
#
# Variables comunes a todo el grupo (buena práctica: no repetirlas host por host):
# [sitio:vars]
# ansible_user=<TU_USUARIO_ACA>
# ansible_python_interpreter=/usr/bin/python3
#
# 🔒 NUNCA pongas una contraseña acá. Se usa clave SSH (Clase 11), y si hace
#    falta un secreto va cifrado con la bóveda de Ansible, nunca en texto plano.
