---
# armar_reto.yml — Armá tu banco de trabajo para auditar el servidor mascota.
# MULTI-DISTRO: Debian/Ubuntu (apt) · Arch (pacman) · Fedora/RHEL (dnf).
#
# ESCENARIO (no es hacking, es laburo de sysadmin): heredaste una flota que
# provisionaba un compañero que ya no está en la empresa. Te dejó el playbook,
# el inventario y la salida de las dos últimas corridas. La segunda corrida
# tendría que haber dado TODO en 'ok' y no dio. Ese es el problema.
#
# Este playbook, en un solo paso:
#   1) Comprueba que tu distro esté soportada (assert sobre ansible_os_family).
#   2) Instala gawk + la librería YAML de Python con el módulo genérico 'package'
#      (usa apt, pacman o dnf según tu distro) dentro de un block/rescue: si no
#      podés escalar a root, el playbook NO se rompe, te avisa y sigue.
#   3) Crea tu banco de trabajo  datos/reto/           (módulo file).
#   4) Deja la EVIDENCIA en solo lectura (0444)        (módulo copy).
#   5) Deja el servidor "desordenado" para que lo arregles (copy con force: false,
#      así una segunda corrida NO te pisa el trabajo).
#   6) Genera tu MISION.txt personalizada              (módulo template + facts).
#   7) Deja la nota del equipo en 0600 = solo su dueño (security by design).
#
# 🔒 Lo que este playbook NO hace, a propósito: no toca /etc, no arranca servicios,
#    no abre puertos, no borra nada fuera de datos/reto/. Solo deja archivos.
#
# Este playbook SÍ es idempotente: corrélo dos veces y la 2ª da changed=0.
# Fijate cómo está escrito, porque es exactamente lo que te vamos a pedir a vos.
#
# ¿No tenés Ansible? Corré primero:   bash comprobar_requisitos.sh
#
# Simular sin aplicar (RECOMENDADO la 1ª vez):
#   ansible-playbook armar_reto.yml -l local --check --diff
# Aplicar de verdad:
#   ansible-playbook armar_reto.yml -l local
#   (si al instalar los paquetes te pide contraseña de sudo, agregá  -K)

- name: Armar el banco de trabajo del reto (Debian/Ubuntu + Arch + Fedora)
  hosts: local
  become: false

  vars:
    # true = instala las herramientas (necesita sudo; agregá -K si te pide clave).
    # Poné false si ya las tenés o no querés usar sudo.
    instalar_paquetes: true
    area: "{{ playbook_dir }}/../datos/reto"

    # La librería YAML de Python se llama DISTINTO en cada familia. Este mapa es
    # la forma prolija de resolverlo: una sola tarea, tres nombres posibles.
    paquete_yaml:
      Debian: python3-yaml
      Archlinux: python-yaml
      RedHat: python3-pyyaml

  pre_tasks:
    # Si tu distro no es de estas 3 familias, el playbook se detiene ACÁ y te lo
    # explica (en vez de romper a la mitad).
    - name: Comprobar que la distribución está soportada
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'Archlinux', 'RedHat']
        fail_msg: >-
          Distro no soportada: {{ ansible_distribution }}
          (familia {{ ansible_os_family }}). Este material corre en Debian/Ubuntu
          (gestor apt), Arch (gestor pacman) y Fedora/RHEL (gestor dnf).
        success_msg: >-
          Distro soportada: {{ ansible_distribution }} ({{ ansible_os_family }}) ·
          librería YAML = {{ paquete_yaml[ansible_os_family] }}.
        quiet: true

    # block/rescue = "intentá esto; si falla, hacé esto otro". Instalar necesita
    # sudo y en un aula eso no siempre está: si falla, seguimos igual porque la
    # evidencia se lee con herramientas que ya tenés.
    - name: Instalar las herramientas de auditoría (tolerante a fallos)
      when: instalar_paquetes | bool
      block:
        - name: Instalar gawk + librería YAML (package elige apt, pacman o dnf)
          ansible.builtin.package:
            name:
              - gawk
              - "{{ paquete_yaml[ansible_os_family] }}"
            state: present
          become: true          # MENOR PRIVILEGIO: sudo solo en ESTA tarea
      rescue:
        - name: Avisar que seguimos sin instalar nada
          ansible.builtin.debug:
            msg: >-
              No pude instalar los paquetes (¿sin sudo?). Sigo igual: la evidencia
              se lee con grep/awk/sort, que ya vienen en tu sistema. Si querés
              instalarlos a mano:
              {{ 'sudo apt install gawk python3-yaml' if ansible_os_family == 'Debian'
                 else ('sudo pacman -S --needed gawk python-yaml' if ansible_os_family == 'Archlinux'
                 else 'sudo dnf install gawk python3-pyyaml') }}

  tasks:
    - name: Crear el banco de trabajo
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ area }}"
        - "{{ area }}/evidencia"
        - "{{ area }}/plantillas"
        - "{{ area }}/servidor"
        - "{{ area }}/servidor/etc"

    # La evidencia va en SOLO LECTURA (0444): no se toca, se lee. Si la editás,
    # dejás de poder responder. force: true = siempre la versión original.
    - name: Dejar la evidencia de la guardia anterior (solo lectura)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/{{ item.src }}"
        dest: "{{ area }}/evidencia/{{ item.dest }}"
        mode: '0444'
      loop:
        - { src: 'corrida_1.txt', dest: 'corrida_1.txt' }
        - { src: 'corrida_2.txt', dest: 'corrida_2.txt' }
        - { src: 'inventario_reto.ini', dest: 'inventario_reto.ini' }
        - { src: 'servidor/etc/hosts_extra', dest: 'hosts_extra_original' }

    - name: Dejar el playbook heredado (el que vas a auditar y reescribir)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/provisionar_reto.yml"
        dest: "{{ area }}/provisionar_reto.yml"
        mode: '0644'

    - name: Dejar la configuración base del equipo (la fuente de verdad)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/plantillas/app.conf.base"
        dest: "{{ area }}/plantillas/app.conf.base"
        mode: '0644'

    # force: false = "si el archivo ya existe, dejalo como está". Así, cuando
    # arregles el servidor con TU playbook y vuelvas a correr éste, no te pisa
    # el trabajo. Sigue siendo idempotente: si ya está, reporta 'ok'.
    - name: Dejar el servidor tal como lo encontraste (sin pisar tu trabajo)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/servidor/etc/{{ item }}"
        dest: "{{ area }}/servidor/etc/{{ item }}"
        mode: '0644'
        force: false
      loop:
        - app.conf
        - hosts_extra

    # OJO: la plantilla usa SOLO datos estables (hostname, distro). Si le metieras
    # la fecha, cada corrida daría 'changed' y el playbook dejaría de ser idempotente.
    - name: Generar TU misión personalizada (módulo template + facts)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/mision.txt.j2"
        dest: "{{ area }}/MISION.txt"
        mode: '0644'

    - name: Dejar la nota del equipo y asegurarla (0600 = solo su dueño)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/nota_equipo.txt"
        dest: "{{ area }}/nota_equipo.txt"
        mode: '0600'

  post_tasks:
    # "Verificar antes de confiar": mostramos cuánta evidencia quedó lista.
    # changed_when: false porque esto SOLO LEE. Sin eso, la tarea diría 'changed'
    # en cada corrida y arruinaría la idempotencia del playbook.
    - name: Contar las líneas de evidencia
      ansible.builtin.command:
        cmd: "wc -l {{ area }}/evidencia/corrida_1.txt {{ area }}/evidencia/corrida_2.txt"
      changed_when: false
      register: conteo

    - name: Mostrar la misión
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - "  Banco de trabajo listo en:  datos/reto/   (abrí MISION.txt)"
          - "  {{ conteo.stdout_lines | join('  |  ') }}"
          - "---------------------------------------------------------------"
          - "  PARTE A (obligatoria): reescribí el playbook heredado para que"
          - "  sea IDEMPOTENTE y dejá el servidor en el estado deseado."
          - "      cp provisionar_reto.yml mi_provisionar.yml   # y arreglalo"
          - "      ansible-playbook mi_provisionar.yml -l local  # 2 veces"
          - "  La 2ª corrida tiene que dar  changed=0 ."
          - ""
          - "  PARTE B: sacá las 3 respuestas de la evidencia y armá:"
          - "      BANDERA{<host_con_desvio>-<tareas_no_idempotentes>-<lineas_duplicadas>}"
          - ""
          - "  Auditá tu trabajo:"
          - "      ansible-playbook auditar_idempotencia.yml -l local"
          - "  Verificá tu bandera (el repo NO la guarda en texto plano, solo"
          - "  su huella SHA-256):"
          - "      ansible-playbook comprobar_bandera.yml -e \"bandera=BANDERA{...}\""
          - "==============================================================="
